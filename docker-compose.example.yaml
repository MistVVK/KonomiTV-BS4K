
version: '3.9'
services:
  konomitv:
    image: konomitv-bs4k
    container_name: KonomiTV
    build:
      context: .
      args:
        CUDA_VERSION: '${KONOMITV_CUDA_VERSION:-12.4}'
        NONFREE: '${KONOMITV_NONFREE:-true}'
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'
    # bind mount 先の所有者と一致する非 root UID/GID で実行
    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    # GPU デバイスへアクセスするための補助グループ
    group_add:
      - '${KONOMITV_VIDEO_GID:-44}'
      - '${KONOMITV_RENDER_GID:-109}'
    # OS 起動時にコンテナを自動起動
    restart: always
    # ネットワークをホスト側と共有する
    # 標準の bridge モード (仮想ネットワーク) だと、ローカルホストとの通信が面倒
    # ref: https://inocop.hatenablog.com/entry/2018/12/18/131526
    network_mode: host
    environment:
      KONOMITV_BS4K_SOURCE_TREE: '/code/source-tree'
    # ボリュームのマウント設定
    # host / 全体は公開せず、config.yaml に指定した必要なディレクトリだけを同じ絶対パスへ個別 mount する
    # 複数の録画・Capture・別置き cache・CM logo・証明書・debug TS を使う場合は、同じ形式で個別 mount を追加する
    # host / 全体は mount しない。必要 folder だけを個別 bind し、SELinux enforcing では shared label z を付ける
    # host 絶対 path の symlink 録画はコンテナ内で /host-rootfs へ rebase して解決する (RecordedScanTask)
    volumes:
      # Git コミットハッシュと未コミット差分を実行時に自動判定するため、ソースツリーを読み取り専用で参照する
      - type: bind
        source: './'
        target: '/code/source-tree/'
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: './config.yaml'
        target: '/code/config.yaml'
        bind:
          selinux: z
      - type: bind
        source: './server/data/'
        target: '/code/server/data/'
        bind:
          selinux: z
      - type: bind
        source: './server/logs/'
        target: '/code/server/logs/'
        bind:
          selinux: z
      - type: bind
        source: '${KONOMITV_RECORDED_FOLDER:-/mnt/TV-Record}'
        target: '/host-rootfs${KONOMITV_RECORDED_FOLDER:-/mnt/TV-Record}'
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: '${KONOMITV_CAPTURE_FOLDER:-/mnt/TV-Capture}'
        target: '/host-rootfs${KONOMITV_CAPTURE_FOLDER:-/mnt/TV-Capture}'
        bind:
          create_host_path: false
          selinux: z
      # 録画シリーズ ACP（Codex / Grok / Gemini）のホスト認証をコンテナへ渡す設定
      # 認証ファイルはイメージに含めず、ホストの file を固定 path へ read-only bind する。
      # 設定 UI の「検出済み / 未検出」は次のコンテナ内 path の読取り可否だけを見る。
      #   Codex:  /run/konomitv-bs4k-host-auth/codex/auth.json
      #   Grok:   /run/konomitv-bs4k-host-auth/grok/auth.json
      #   Google: /run/konomitv-bs4k-host-auth/google/application_default_credentials.json
      # 使う provider だけコメントアウトを解除し、.env などで絶対 path を渡す。
      #   KONOMITV_BS4K_CODEX_AUTH_FILE=.../auth.json
      #   KONOMITV_BS4K_GROK_AUTH_FILE=.../auth.json
      #   KONOMITV_BS4K_GOOGLE_ADC_FILE=.../application_default_credentials.json
      # create_host_path: false のため、source の実ファイルが無いと compose up に失敗する。
      # 必要な provider だけを有効にすること（使わない mount はコメントのまま）。
      # 別ファイルで足す場合は docker-compose.acp-codex-auth.yaml なども利用できる。
      # Codex / Grok は UI から専用プロファイルへ「取り込み」、Google ADC は mount 読取りのみ。
      # OS keyring だけだと host に auth.json が無いことがある → cli_auth_credentials_store = "file"。
      # - type: bind
      #   source: '${KONOMITV_BS4K_CODEX_AUTH_FILE:?KONOMITV_BS4K_CODEX_AUTH_FILE must be an absolute auth.json path}'
      #   target: '/run/konomitv-bs4k-host-auth/codex/auth.json'
      #   read_only: true
      #   bind:
      #     create_host_path: false
      #     selinux: z
      # - type: bind
      #   source: '${KONOMITV_BS4K_GROK_AUTH_FILE:?KONOMITV_BS4K_GROK_AUTH_FILE must be an absolute auth.json path}'
      #   target: '/run/konomitv-bs4k-host-auth/grok/auth.json'
      #   read_only: true
      #   bind:
      #     create_host_path: false
      #     selinux: z
      # - type: bind
      #   source: '${KONOMITV_BS4K_GOOGLE_ADC_FILE:?KONOMITV_BS4K_GOOGLE_ADC_FILE must be an absolute ADC JSON path}'
      #   target: '/run/konomitv-bs4k-host-auth/google/application_default_credentials.json'
      #   read_only: true
      #   bind:
      #     create_host_path: false
      #     selinux: z

    # ==================== ↓↓↓↓↓ ここからユーザー設定 ↓↓↓↓↓ ====================

    # FFmpeg 8 の Intel QSV / AMD VAAPI・AMF を利用するために、GPU デバイスへアクセスする設定
    # AMD AMF を利用する場合は NONFREE=true で Docker イメージをビルドする必要があります。
    # GPU が1個も搭載されていない (/dev/dri/ 以下のデバイスファイルが存在しない) 特殊な環境では、
    # コメントアウトしてこの設定を無効にしないと、KonomiTV-BS4K サーバーを起動できなくなります。
    devices:
      - '/dev/dri/:/dev/dri/'

    # FFmpeg 8 の NVIDIA NVENC を利用するために必要な設定
    # NVIDIA NVENC を利用するには、別途 NVIDIA Graphics Driver と
    # NVIDIA Container Toolkit のインストールが必要です。
    # コメントアウトを解除してこの設定を有効にすると、NVIDIA GPU が搭載されていない環境では KonomiTV-BS4K サーバーを起動できなくなります。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [compute, utility, video]

    # ==================== ↑↑↑↑↑ ここまでユーザー設定 ↑↑↑↑↑ ====================
