# AMD GPU (AMF) 向けの GPU overlay。
# vendor flag を直接指定し、AMD proprietary runtime だけを含むイメージを構築する。
# Intel も併用する場合は .env で KONOMITV_INTEL_NONFREE=true を明示する（後勝ちではなく各フラグが独立）。
services:
  konomitv:
    build:
      args:
        INTEL_NONFREE: '${KONOMITV_INTEL_NONFREE:-false}'
        AMD_NONFREE: '${KONOMITV_AMD_NONFREE:-true}'
    devices:
      # 空なら /dev/dri/ 全体を渡して自動選択する。特定の GPU だけを使う場合は
      # KONOMITV_AMD_DRI_DEVICE=/dev/dri/renderD128 のように render node を指定する。
      - '${KONOMITV_AMD_DRI_DEVICE:-/dev/dri/}'
