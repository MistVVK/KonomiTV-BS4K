name: konomitv-bs4k-development

services:
  konomitv:
    image: konomitv-bs4k-development
    container_name: KonomiTV-BS4K-Development
    build:
      context: .
      target: verified-runtime
      args:
        CUDA_VERSION: '${KONOMITV_CUDA_VERSION:-12.4}'
        NONFREE: '${KONOMITV_NONFREE:-true}'
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'

    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    group_add:
      - '${KONOMITV_VIDEO_GID:-44}'
      - '${KONOMITV_RENDER_GID:-109}'
    restart: unless-stopped
    network_mode: host
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      KONOMITV_BS4K_SOURCE_TREE: '/code/source-tree'
      GOOGLE_APPLICATION_CREDENTIALS: '/host-home/.config/gcloud/application_default_credentials.json'
      GOOGLE_VERTEX_PROJECT: '${GOOGLE_VERTEX_PROJECT:-}'
      GOOGLE_VERTEX_LOCATION: '${GOOGLE_VERTEX_LOCATION:-global}'
      OPENCODE_ENABLE_EXA: '1'

    volumes:
      - type: bind
        source: './'
        target: '/code/source-tree/'
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: './docker/development/state/config.yaml'
        target: '/code/config.yaml'
        bind:
          selinux: z
      - type: bind
        source: './docker/development/state/data/'
        target: '/code/server/data/'
        bind:
          selinux: z
      - type: bind
        source: './docker/development/state/logs/'
        target: '/code/server/logs/'
        bind:
          selinux: z
      - type: bind
        source: '/'
        target: '/host-rootfs/'
      - type: bind
        source: '${HOME}'
        target: '/host-home/'
        read_only: true

    devices:
      - '/dev/dri/:/dev/dri/'
