#
# ================================== 全般の設定 ==================================
general:

    # 利用するバックエンド
    # EDCB・Mirakurun のいずれかを選択してください。
    # バックエンドに Mirakurun が選択されているときは、録画予約機能は利用できません。
    backend: 'EDCB'

    # ニコニコ実況 / NX-Jikkyo 連携を有効にするか
    # 有効にすると KonomiTV-BS4K サーバーと各クライアントから外部の実況サービスへ接続できるようになります。
    # 設定変更を反映するには KonomiTV-BS4K サーバーの再起動が必要です。
    jikkyo_enabled: false

    # 利用するバックエンドが EDCB のとき、常に Mirakurun / mirakc から放送波を受信するか
    # バックエンドに Mirakurun が選択されているときは効果がありません。
    # EDCB に加えて mirakurun_url で指定した Mirakurun / mirakc にアクセスできる必要があります。
    # EDCB はチューナー起動やチャンネル切り替えに時間がかかるため、Mirakurun / mirakc が利用できる環境であれば、この設定を有効にするとより快適に使えます。
    always_receive_tv_from_mirakurun: false

    # EDCB (EpgTimerNW) の TCP API の URL
    # バックエンドに EDCB が選択されているときに利用されます。
    # tcp://edcb-namedpipe/ と指定すると、TCP API の代わりに名前付きパイプを使って通信します (ローカルのみ)。
    edcb_url: 'tcp://127.0.0.1:4510/'

    # Mirakurun / mirakc の HTTP API の URL
    # バックエンドに Mirakurun が選択されているときに利用されます。
    mirakurun_url: 'http://127.0.0.1:40772/'

    # BS4K ライブ入力形式。MpegTs (従来経路) または Tlv (MMT/TLV 専用経路) を指定します。
    # Tlv は BS4K ライブ視聴だけに適用され、番組情報や録画予約のバックエンドは変更しません。
    konomitv_bs4k_live_transport: 'MpegTs'

    # Tlv 選択時に BS4K TLV を decode=0 で取得する専用 Mirakurun / mirakc の URL
    # MpegTs 選択時は null のままで構いません。
    konomitv_bs4k_tlv_mirakurun_url: null

    # 利用するエンコーダー
    # BS4K のライブ視聴や録画視聴以外で使用されます。
    # FFmpeg・QSV・NVENC・AMF から選択してください。
    # FFmpeg はソフトウェアエンコーダーです。すべての PC で利用できますが、CPU に多大な負荷がかかり、パフォーマンスが悪いです。
    # QSV・NVENC・AMF はハードウェアエンコーダーです。CPU 負荷が低く、パフォーマンスがとても高いです（おすすめ）。
    # Intel Graphics 搭載の Intel CPU をお使いなら、QSV が使えます。
    # Geforce などの NVIDIA GPU をお使いなら、NVENC が使えます。
    # Radeon などの AMD GPU をお使いなら、AMF が使えます。
    encoder: 'FFmpeg'

    # ライブ HW エンコード時の SAR (アスペクト比) モード
    # CPU (既定): 放送中のアスペクト比をフレームごとに追従し、4:3 は 16:9 枠へ左右黒帯を付けて最適な出力にします。
    #   HW decode は MPEG-2 の SAR を落とすため、このモードは SW decode + CPU フィルタで SAR を残します。
    # GPU: 入力解像度を決め打ちせず、来た coded size をそのまま encode size へ伸縮し、出力だけを 16:9 にします。
    #   1440x1080 (地デジ HD 典型) も 1920x1080 (BS11 など) もそのまま encode size へ伸縮するため、4:3 の CM は横に伸びます。
    # 24fps モードではこの設定は無視され、常に CPU 相当 (ソフトウェア decode) の経路でアスペクト比を追従します。
    # BS4K のライブ視聴ではこの設定は無視され、常に GPU 縮小で 16:9 固定になります。
    konomitv_bs4k_live_sar_mode: 'CPU'

    # BS4K のライブ視聴や録画視聴で利用するエンコーダー
    encoder_bs4k: 'FFmpeg'

    # BS4K のライブ視聴で利用する入力解析サイズ (KB)
    # エンコーダーが映像ヘッダーを探すために読むデータ量です。
    # BS4K HEVC 60p は途中から掴むと解析に時間がかかるため、通常チャンネルより大きめにしています。
    encoder_bs4k_input_probesize: 3000

    # BS4K のライブ視聴で利用する入力解析時間 (秒)
    encoder_bs4k_input_analyze: 1.5

    # BS4K のライブ視聴で入力解析を強化するか
    # 無効にすると、通常チャンネルと同じ入力解析サイズ・時間を使います。
    encoder_bs4k_input_analysis_enabled: true

    # BS4K のライブ視聴で利用する mux 待ち幅 (KB)
    encoder_bs4k_max_interleave_delta: 800

    # BS4K のライブ視聴でエンコーダーを即時出力優先にするか
    # 既定は安定性優先（無効）。有効にすると再読み込みが多発するおそれがあります。
    encoder_bs4k_low_latency: false

    # 受入試験中だけBridge起動counterを能力APIの応答headerへ公開するか
    # 通常運用では視聴活動の推測を防ぐため、必ず無効のままにしてください。
    konomitv_bs4k_acceptance_diagnostics_enabled: false

    # BS4K のライブ視聴ではプレイヤーを通常バッファで再生するか
    # 有効にすると、BS4K のライブ視聴時だけユーザーの低遅延視聴設定を使わず、通常の再生バッファを使います。
    # 既定は安定性優先（有効）。無効にすると低遅延視聴時に再読み込みが多発するおそれがあります。
    bs4k_ignore_viewer_low_latency: true

    # BS4K のライブ視聴開始時に先頭 TS を捨てるか
    # 有効にすると、チューナー切替直後の不安定な TS をエンコーダーに渡さず破棄します。
    bs4k_live_startup_discard_enabled: true

    # BS4K のライブ視聴開始時に捨てる TS の秒数
    bs4k_live_startup_discard_seconds: 2.0

    # 番組情報の更新間隔 (分)
    # 番組情報を EDCB または Mirakurun / mirakc から取得する間隔を設定します。デフォルトは 5 (分) です。
    program_update_interval: 5.0

    # デバッグモードを有効にするか
    # 有効にすると、デバッグログも出力されるようになります。
    debug: false

    # エンコーダーのログを有効にするか
    # 有効にすると、ライブ視聴時のエンコーダーのログが server/logs/KonomiTV-BS4K-Encoder-(ストリームID).log に保存されます。
    # さらにデバッグモードが有効のときは、デバッグログとしてリアルタイムにエンコーダーのログが出力されます。
    debug_encoder: false

# ================================ サーバーの設定 ================================
server:

    # KonomiTV-BS4K サーバーのリッスンポート
    # デフォルトのリッスンポートは 7000 です。
    port: 7000

    # 録画シリーズ AI で使用する製品用 OpenCode serve のリッスンポート
    # 通常はデフォルトの 4097 から変更する必要はありません。
    opencode_serve_port: 4097

    # HTTPS / リバースプロキシの動作モード
    # akebi (既定): Akebi Keyless Server が port で HTTPS を提供します。証明書設定と trusted_proxy_cidrs は指定できません。
    # certificate: Uvicorn が port で直接 HTTPS を提供します。証明書と秘密鍵の両方が必須です。
    # reverse_proxy: Uvicorn が port で HTTP を提供します。必ず信頼できるリバースプロキシの背後で利用してください。
    https_mode: 'akebi'

    # certificate モードで使用する HTTPS 証明書・秘密鍵のホスト上の絶対パス
    # Docker コンテナ内では実アクセス用の内部パスへ自動的に変換されます。
    # akebi / reverse_proxy モードでは指定できません。
    custom_https_certificate: null
    custom_https_private_key: null

    # reverse_proxy モードで Uvicorn が HTTP を待ち受けるアドレス
    # 通常は 0.0.0.0 のまま変更する必要はありません。akebi / certificate モードでは使用されません。
    reverse_proxy_listen_address: '0.0.0.0'

    # KonomiTV-BS4K へ直接 TCP 接続できる、信頼済みリバースプロキシの CIDR 許可リスト
    # reverse_proxy モードでは1件以上必須です。実際の接続元がこの範囲外の場合は HTTP 403 で拒否します。
    # nginx / Apache などのプロキシ側では X-Forwarded-For / Proto / Host を必ず上書きしてください。
    # IPv4・IPv6 の両方を指定できます。akebi / certificate モードでは空のままにしてください。
    trusted_proxy_cidrs: []

# =============================== 互換 API の設定 ===============================
compatibility_api:

    # Komorebi など、upstream KonomiTV API との互換性を必要とするクライアント向け API を別ポートで公開するか
    enabled: false

    # 互換 API のリッスンポート
    # akebi モードでは、このポート + 10 も内部通信用に使用します。
    port: 7200

    # 互換 API の HTTPS / リバースプロキシ動作モード
    # inherit: 通常 API と同じ設定を使用します。旧バージョンと同じ動作です。
    # akebi / certificate / reverse_proxy: 互換 API 専用の設定を使用します。
    https_mode: 'inherit'

    # https_mode: 'certificate' の場合に使用する、互換 API 専用の HTTPS 証明書と秘密鍵
    # Docker でインストールした場合も、ホストマシン側のファイルの絶対パスを指定してください。
    custom_https_certificate: null
    custom_https_private_key: null

    # https_mode: 'reverse_proxy' の場合に使用する、互換 API 専用のリッスンアドレス
    reverse_proxy_listen_address: '0.0.0.0'

    # 転送ヘッダーを信頼するリバースプロキシの CIDR
    # https_mode: 'reverse_proxy' の場合は1件以上必須です。
    trusted_proxy_cidrs: []

    # 提供する互換プロファイル
    # 現在は KomorebiV1 のみ利用できます。
    profile: 'KomorebiV1'

# ======================= テレビのライブストリーミングの設定 =======================
tv:

    # チャンネル表示・選局で優先するエリア (地デジ)
    # 複数の地域の放送波が受信できる環境で、リモコン番号が同じチャンネルが複数ある場合に、
    # どのエリアのチャンネルを優先して表示・選局するかを設定します。デフォルトは null (未設定) です。
    # 優先エリアのチャンネルは枝番なし (例: Ch:011) で、それ以外のチャンネルは枝番付き (例: Ch:011-1) で表示されます。
    # キーボードショートカットやリモコンボタンでの選局時も、優先エリアのチャンネルが選局されます。
    # 設定しない場合は、(ネットワークID)-(サービスID) の数値順で優先順位が決まります。
    preferred_terrestrial_region: null

    # 誰も見ていないチャンネルのエンコードタスクを何秒まで維持するか
    # 10 秒に設定したなら、10 秒間誰も見ていない状態が継続したらエンコードタスク（エンコーダー）を終了します。
    # 0 秒に設定すると、ネット回線が瞬断したりリロードしただけでチューナーとエンコーダーの再起動が必要になり、
    # 再生復帰までに時間がかかります。余裕をもたせておく事をおすすめします。
    max_alive_time: 10

    # デバッグ用に再生する TS ファイルの絶対パス（デバッグ用設定のため、変更は推奨しない）
    # この値に TS ファイルのパスを指定すると、すべてのチャンネルにおいて、ストリーミングされる映像（字幕・文字スーパーを含む）が
    # リアルタイムで放送されているものから、指定した TS ファイルのものに強制的に置き換えられます。
    # 開発者がライブストリーミング関連の機能をテストするために使う特殊なデバッグ用設定です。
    # Docker でインストールした場合も、ホストマシン側のファイルの絶対パスを指定してください。
    debug_mode_ts_path: null

# ==================== ビデオのオンデマンドストリーミングの設定 ====================
video:

    # 録画済み番組の保存先フォルダの絶対パス
    # 複数の保存先フォルダを指定できます。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    recorded_folders: [
        '/mnt/TV-Record',
    ]

    # 録画フォルダのスキャン対象から除外するサブフォルダの絶対パス
    # 録画フォルダ以下にある一時フォルダなど、スキャン対象から除外したいサブフォルダを指定できます。
    # シンボリックリンク解決前のパスと、解決後の実体パスの両方で前方一致判定を行います。
    # 例えば、'/mnt/TV-Record/Temp' を指定すると、そのサブフォルダ以下の録画ファイルはスキャン対象から除外されます。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    exclude_scan_paths: []

    # 録画再生で生成する fMP4 キャッシュの保存先フォルダの絶対パス
    # null の場合は、各録画ファイルと同じフォルダへキャッシュファイルを保存します。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    recorded_fmp4_cache_folder: null

    # サーバー起動後に、再生用インデックスが未生成の既存録画を順番に解析するかどうか
    # false にしても、再生を要求した録画と新しく完了した録画のインデックス生成は継続します。
    # 大量の既存録画を解析するときは、録画ファイルの全編読み出しによる I/O 負荷が発生します。
    recorded_playback_index_backfill_enabled: true

# =============================== キャプチャの設定 ===============================
capture:

    # アップロードしたキャプチャ画像の保存先フォルダの絶対パス
    # クライアントの [キャプチャの保存先] 設定で [KonomiTV-BS4K サーバーにアップロード] または
    # [ブラウザでのダウンロードと、KonomiTV-BS4K サーバーへのアップロードを両方行う] が選択されているときに利用されます。
    # 複数の保存先フォルダを指定できます。先頭から順に利用され、保存先フォルダがいっぱいになったら次の保存先フォルダに保存されます。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    upload_folders: [
        '/mnt/TV-Capture',
    ]

# =============================== CM 解析の設定 ===============================
cm_analysis:

    # 新規録画に対する自動 CM 解析を有効にするかどうか
    # false の場合、解析状態は Pending のままになり、共有ロゴフォルダの手動操作は可能です。
    enabled: false

    # CM ロゴ (.lgd) を置く共有フォルダの絶対パス
    # null の場合はサーバー data 配下の既定フォルダ (cm-analysis/logos) を使います。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    logo_directory: null

    # 新規 CM 解析だけを除外するディレクトリの絶対パス
    # 録画フォルダ全体のスキャン除外 (video.exclude_scan_paths) とは独立です。
    # Docker でインストールした場合も、ホストマシン側のフォルダの絶対パスを指定してください。
    excluded_directories: []
