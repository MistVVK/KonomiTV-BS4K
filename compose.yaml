name: konomitv-bs4k

# GPU 構成は compose.intel.yaml / compose.amd.yaml / compose.nvidia.yaml で追加する。
services:
  konomitv:
    image: konomitv-bs4k
    container_name: KonomiTV-BS4K
    build:
      context: .
      target: runtime
      args:
        CUDA_VERSION: '${KONOMITV_CUDA_VERSION:-12.4}'
        NONFREE: '${KONOMITV_NONFREE:-nonfree}'
        # ベンダー選択は overlay 既定に任せるのが基本。overlay なしの direct Compose でも
        # .env の明示が黙って無視されないよう、未指定 (unset) をそのまま Dockerfile へ伝達する
        INTEL_NONFREE: '${KONOMITV_INTEL_NONFREE:-unset}'
        AMD_NONFREE: '${KONOMITV_AMD_NONFREE:-unset}'
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'

    # bind mount 先の所有者と一致する非 root UID/GID で実行する。
    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    group_add:
      - '${KONOMITV_VIDEO_GID:-44}'
      - '${KONOMITV_RENDER_GID:-109}'
    restart: always
    network_mode: host
    environment:
      KONOMITV_BS4K_SOURCE_TREE: '/code/source-tree'
      OPENCODE_ENABLE_EXA: '1'
      GOOGLE_APPLICATION_CREDENTIALS: '/host-home/.config/gcloud/application_default_credentials.json'
      GOOGLE_VERTEX_PROJECT: '${GOOGLE_VERTEX_PROJECT:-}'
      GOOGLE_VERTEX_LOCATION: '${GOOGLE_VERTEX_LOCATION:-global}'

    volumes:
      # ワークツリーの Git commit を検出するため、ソースツリーを read-only で参照する。
      - type: bind
        source: './'
        target: '/code/source-tree/'
        read_only: true
        bind:
          selinux: z
      # 公開環境の設定・DB・ログは Compose 起点の各パスへ保存する。
      - type: bind
        source: './config.yaml'
        target: '/code/config.yaml'
        bind:
          selinux: z
      - type: bind
        source: './server/data/'
        target: '/code/server/data/'
        bind:
          selinux: z
      - type: bind
        source: './server/logs/'
        target: '/code/server/logs/'
        bind:
          selinux: z
      # RC制御とmount伝播の起点は環境ごとのdata内へ分離する。
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-control/'
        target: '/run/konomitv-bs4k-cloud/'
        bind:
          selinux: z
          create_host_path: false
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-mounts/'
        target: '/cloud-mounts/'
        read_only: true
        bind:
          selinux: z
          create_host_path: false
          propagation: rslave
      # config.yaml のホスト絶対パスをコンテナ内の /host-rootfs 配下へ対応付ける。
      - type: bind
        source: '/'
        target: '/host-rootfs/'
      # ACP CLI と Google ADC の認証情報をホストの標準パスから検出する。
      - type: bind
        source: '${HOME}'
        target: '/host-home/'
        read_only: true

  cloud-storage:
    image: konomitv-bs4k-cloud-storage
    extends:
      file: '${KONOMITV_BS4K_RECORDING_BINDS_FILE:-./docker/cloud-storage/recording-binds.empty.yaml}'
      service: konomitv-bs4k-recording-inputs
    init: true
    build:
      context: .
      dockerfile: docker/cloud-storage/Dockerfile
      args:
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'
    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    restart: always
    read_only: true
    # FUSEとmount権限はこのサービスだけに付与する。
    cap_drop: [ALL]
    # mode0700の共有先をsetuid fusermount3が探索するために必要。DAC_OVERRIDEは付けない。
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-control/'
        target: '/run/konomitv-bs4k-cloud/'
        bind:
          selinux: z
          create_host_path: false
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-mounts/'
        target: '/cloud-mounts/'
        bind:
          selinux: z
          create_host_path: false
          propagation: rshared
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-storage/'
        target: '/cloud-credentials/'
        bind:
          selinux: z
          create_host_path: false
      # 生成物専用spoolだけを共有する。認証・鍵・DBの入力範囲は拡張しない。
      - type: bind
        source: './server/data/konomitv-bs4k-cloud-generated-source/'
        target: '/cloud-generated-source/'
        read_only: true
        bind:
          selinux: z
          create_host_path: false
