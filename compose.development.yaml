name: konomitv-bs4k-development

# GPU 構成は compose.intel.yaml / compose.amd.yaml / compose.nvidia.yaml で追加する。
services:
  konomitv:
    image: konomitv-bs4k-development
    container_name: KonomiTV-BS4K-Development
    build:
      context: .
      target: verified-runtime
      args:
        CUDA_VERSION: '${KONOMITV_CUDA_VERSION:-12.4}'
        NONFREE: '${KONOMITV_NONFREE:-nonfree}'
        # 基本 Compose 単体でも .env の vendor 明示が無視されないよう Dockerfile へ伝達する
        INTEL_NONFREE: '${KONOMITV_INTEL_NONFREE:-unset}'
        AMD_NONFREE: '${KONOMITV_AMD_NONFREE:-unset}'
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'

    # bind mount 先の所有者と一致する非 root UID/GID で実行する。
    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    group_add:
      - '${KONOMITV_VIDEO_GID:-44}'
      - '${KONOMITV_RENDER_GID:-109}'
    # Development は手動停止を維持し、実行時メモリを 8GB に制限する。
    restart: unless-stopped
    network_mode: host
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      KONOMITV_BS4K_SOURCE_TREE: '/code/source-tree'
      OPENCODE_ENABLE_EXA: '1'
      GOOGLE_APPLICATION_CREDENTIALS: '/host-home/.config/gcloud/application_default_credentials.json'
      GOOGLE_VERTEX_PROJECT: '${GOOGLE_VERTEX_PROJECT:-}'
      GOOGLE_VERTEX_LOCATION: '${GOOGLE_VERTEX_LOCATION:-global}'

    volumes:
      # ワークツリーの Git commit を検出するため、ソースツリーを read-only で参照する。
      - type: bind
        source: './'
        target: '/code/source-tree/'
        read_only: true
        bind:
          selinux: z
      # Development の設定・DB・ログは専用の state ディレクトリへ隔離する。
      - type: bind
        source: './docker/development/state/config.yaml'
        target: '/code/config.yaml'
        bind:
          selinux: z
      - type: bind
        source: './docker/development/state/data/'
        target: '/code/server/data/'
        bind:
          selinux: z
      - type: bind
        source: './docker/development/state/logs/'
        target: '/code/server/logs/'
        bind:
          selinux: z
      # RCの制御はUnix socketだけで行う。FUSEとmount権限は専用sidecarへ分離する。
      - type: bind
        source: './docker/development/state/cloud-control/'
        target: '/run/konomitv-bs4k-cloud/'
        bind:
          selinux: z
          create_host_path: false
      - type: bind
        source: './docker/development/state/cloud-mounts/'
        target: '/cloud-mounts/'
        read_only: true
        bind:
          selinux: z
          create_host_path: false
          propagation: rslave
      # config.yaml のホスト絶対パスをコンテナ内の /host-rootfs 配下へ対応付ける。
      - type: bind
        source: '/'
        target: '/host-rootfs/'
      # ACP CLI と Google ADC の認証情報をホストの標準パスから検出する。
      - type: bind
        source: '${HOME}'
        target: '/host-home/'
        read_only: true

  cloud-storage:
    image: konomitv-bs4k-development-cloud-storage
    extends:
      file: '${KONOMITV_BS4K_RECORDING_BINDS_FILE:-./docker/cloud-storage/recording-binds.empty.yaml}'
      service: konomitv-bs4k-recording-inputs
    init: true
    build:
      context: .
      dockerfile: docker/cloud-storage/Dockerfile
      args:
        KONOMITV_UID: '${KONOMITV_UID:-1000}'
        KONOMITV_GID: '${KONOMITV_GID:-1000}'
    user: '${KONOMITV_UID:-1000}:${KONOMITV_GID:-1000}'
    restart: unless-stopped
    read_only: true
    # 常駐プロセスは非rootで動かし、mountにはsetuid fusermount3を使用する。
    # ホストTCPやDocker socketは公開しない。
    cap_drop: [ALL]
    # setuid fusermount3がmode0700の共有先を探索できるよう、読取り探索だけを許可する。
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: './docker/development/state/cloud-control/'
        target: '/run/konomitv-bs4k-cloud/'
        bind:
          selinux: z
          create_host_path: false
      - type: bind
        source: './docker/development/state/cloud-mounts/'
        target: '/cloud-mounts/'
        bind:
          selinux: z
          create_host_path: false
          propagation: rshared
      # 生成物だけをサイズ既知の入力として共有し、DB・JWT・鍵を含むdata全体は渡さない。
      - type: bind
        source: './docker/development/state/data/konomitv-bs4k-cloud-generated-source/'
        target: '/cloud-generated-source/'
        read_only: true
        bind:
          selinux: z
          create_host_path: false
      # 認証は通常のrclone入力として使い、更新tokenの書戻しもrcloneへ任せる。
      - type: bind
        source: './docker/development/state/data/konomitv-bs4k-cloud-storage/'
        target: '/cloud-credentials/'
        bind:
          selinux: z
          create_host_path: false
